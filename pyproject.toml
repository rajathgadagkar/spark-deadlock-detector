[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-deadlock-detector"
version = "1.0.0"
description = "Distributed Resource Allocation Graph (RAG) analyzer and deadlock cycle detector powered by Apache Spark (PySpark)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Rajath Gadagkar", email = "rajathgadagkar@gmail.com" },
]
keywords = [
    "pyspark",
    "apache-spark",
    "mapreduce",
    "deadlock-detection",
    "resource-allocation-graph",
    "distributed-systems",
    "graph-analytics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pyspark>=3.4.1",
]

[project.scripts]
spark-deadlock-detector = "main:main"

[tool.setuptools.packages.find]
include = ["deadlock_detector*"]
