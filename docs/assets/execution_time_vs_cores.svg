<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="400" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="380" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Cycle Detection Execution Time vs. Spark Worker Cores</text>
  <text x="380" y="58" text-anchor="middle" font-size="12" fill="#6b7280">Average of 2 runs on sample_hpc_rag.log (200 records → 18 unique edges, 3 deadlock cycles)</text>

  <!-- Gridlines (Y: 0 to 16s; plot area: x=90..700, y=85..325 -> height=240, 15px per second) -->
  <g stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1">
    <line x1="90" y1="85" x2="700" y2="85"/>
    <line x1="90" y1="145" x2="700" y2="145"/>
    <line x1="90" y1="205" x2="700" y2="205"/>
    <line x1="90" y1="265" x2="700" y2="265"/>
  </g>
  <!-- Axes -->
  <line x1="90" y1="85" x2="90" y2="325" stroke="#374151" stroke-width="1.5"/>
  <line x1="90" y1="325" x2="700" y2="325" stroke="#374151" stroke-width="1.5"/>

  <!-- Y-axis labels -->
  <g font-size="12" fill="#4b5563" text-anchor="end">
    <text x="80" y="89">16s</text>
    <text x="80" y="149">12s</text>
    <text x="80" y="209">8s</text>
    <text x="80" y="269">4s</text>
    <text x="80" y="329">0s</text>
  </g>
  <text x="26" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" transform="rotate(-90 26 205)">Average Execution Time (seconds)</text>

  <!-- X-axis labels (1->140, 2->220, 4->380, 8->660) -->
  <g font-size="12" fill="#4b5563" text-anchor="middle">
    <text x="140" y="346">1</text>
    <text x="220" y="346">2</text>
    <text x="380" y="346">4</text>
    <text x="660" y="346">8</text>
  </g>
  <text x="395" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Number of Local Spark Cores</text>

  <!-- Area fill under curve -->
  <polygon points="140,218.35 220,201.1 380,176.05 660,102.85 660,325 140,325" fill="#2563eb" fill-opacity="0.08"/>

  <!-- Line (y = 325 - val*15): 7.11->218.35, 8.26->201.1, 9.93->176.05, 14.81->102.85 -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            points="140,218.35 220,201.1 380,176.05 660,102.85"/>

  <!-- Data points & value labels -->
  <g fill="#2563eb" stroke="#ffffff" stroke-width="2.5">
    <circle cx="140" cy="218.35" r="6"/>
    <circle cx="220" cy="201.1" r="6"/>
    <circle cx="380" cy="176.05" r="6"/>
    <circle cx="660" cy="102.85" r="6"/>
  </g>
  <g font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    <text x="140" y="204">7.11s</text>
    <text x="220" y="187">8.26s</text>
    <text x="380" y="162">9.93s</text>
    <text x="660" y="90">14.81s</text>
  </g>
</svg>
